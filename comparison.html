<!doctype html>
<html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DHA Comparison Lab</title>
<style>
body{margin:0;background:#101722;color:#edf3ff;font:15px system-ui;padding:16px}h1{font-size:22px}a{color:#8bd0ff}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:15px 0}button,select,input{font:inherit;padding:9px;border-radius:7px}button{background:#264c6b;color:white;border:1px solid #5785a8;cursor:pointer}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:15px}.tile{background:#202c3b;padding:10px;border-radius:9px}.tile canvas{width:100%;height:auto;display:block;background:#05080d}.tile h2{font-size:16px;margin:4px 0 10px}.hint{color:#acbfd1;font-size:13px}#status{margin:12px 0}
</style>
<h1>DHA Comparison Lab · тест кадру</h1>
<p class="hint">Всі результати створюються локально в браузері на основі реального WebGL-шейдера цього репозиторію. DehazeFormer поки не підключено; його результати не імітуються.</p>
<div class="controls"><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><label>Розмір <select id="size"><option value="1280">До 1280 px</option><option value="1920">До 1920 px</option><option value="4096">До 4096 px</option></select></label><button id="run" disabled>Порівняти</button><button id="save" disabled>Зберегти всі PNG</button></div>
<div id="status">Вибери вихідний кадр.</div><div class="grid" id="grid"></div>
<p><a href="./index.html">Повернутися до Dehaze Media Lab</a></p>
<script type="module">
import {DehazeGL} from './src/gl.js';
import {estimateFog,fogLabel} from './src/auto3.js';
const $=id=>document.getElementById(id),grid=$('grid');
const modes=[["ORIGINAL","off",0],["AUTO 1.0","auto1",14],["AUTO 2.0","auto2",16],["AUTO 3.0","auto3",17],["ADAPTIVE M1","manual",1],["FAST DCP M2","manual",2],["LIVE DCP M3","manual",3],["CLASSICAL M4","manual",4],["DCP BALANCED M5","manual",5],["DCP STRONG M6","manual",6],["CAP M7","manual",7],["CLAHE-LIKE M8","manual",8],["RETINEX-LIKE M9","manual",9],["EDGE DCP M10","manual",10],["MS RETINEX (LITE) M11","manual",11],["LIME LIGHT M12","manual",12],["LOCAL GAMMA M13","manual",13],["CLASSIC + DCP M14","manual",14],["LOCAL CONTRAST M15","manual",15]];
let img=null,results=[];
$('file').onchange=()=>{const file=$('file').files[0];if(!file)return;const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{img=im;URL.revokeObjectURL(url);$('run').disabled=false;$('status').textContent='Кадр завантажено: '+im.naturalWidth+'×'+im.naturalHeight;};im.onerror=()=>{$('status').textContent='Помилка відкриття зображення';URL.revokeObjectURL(url)};im.src=url};
$('run').onclick=async()=>{if(!img)return;$('run').disabled=true;$('save').disabled=true;grid.replaceChildren();results=[];
try{
const max=Number($('size').value),scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
const source=document.createElement('canvas');source.width=Math.round(img.naturalWidth*scale);source.height=Math.round(img.naturalHeight*scale);const ctx=source.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,source.width,source.height);
const sample=document.createElement('canvas');sample.width=160;sample.height=Math.max(5,Math.round(160*source.height/source.width));const sx=sample.getContext('2d',{willReadFrequently:true});sx.drawImage(source,0,0,sample.width,sample.height);const fog=estimateFog(sx.getImageData(0,0,sample.width,sample.height));
$('status').textContent='Оцінка AUTO 3.0: '+(fog.valid?fogLabel(fog.density)+' ('+Math.round(fog.density*100)+'%)':'недоступна')+'. Обробка…';
const settings={processing:'manual',strength:65,haze:65,brightness:0,contrast:10,saturation:100,sky:70,detail:15};
for(const [label,processing,mode] of modes){
const tile=document.createElement('div');tile.className='tile';const title=document.createElement('h2');title.textContent=label;const canvas=document.createElement('canvas');canvas.width=source.width;canvas.height=source.height;tile.append(title,canvas);grid.append(tile);
if(processing==='off'){canvas.getContext('2d').drawImage(source,0,0)}else{
const gl=new DehazeGL(canvas);await gl.initialize();gl.draw(source,{...settings,processing},mode,false,fog);
}
results.push([label,canvas]);await new Promise(r=>setTimeout(r,0));
}
$('status').textContent='Готово: '+results.length+' варіантів. Результати залежать від можливостей WebGL пристрою.';$('save').disabled=false;
}catch(e){$('status').textContent='Помилка: '+e.message;console.error(e)}
finally{$('run').disabled=false}};
$('save').onclick=async()=>{for(const [name,canvas] of results){const a=document.createElement('a');a.download='DHA_'+name.replace(/[^a-z0-9]+/gi,'_')+'.png';a.href=canvas.toDataURL('image/png');a.click();await new Promise(r=>setTimeout(r,250))}};
</script></html>
