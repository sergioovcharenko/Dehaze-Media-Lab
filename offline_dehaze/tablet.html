<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DHA Comparison Lab</title><style>body{margin:0;background:#111820;color:#f0f4f8;font:16px system-ui}header{padding:18px;background:#202c37}main{padding:16px;max-width:1300px;margin:auto}input,button{padding:12px;border-radius:8px}button{background:#38a56d;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:18px}.tile{background:#202c37;border-radius:12px;overflow:hidden}.tile h3{margin:12px;font-size:15px}.tile img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#101419}#status{margin-top:12px;white-space:pre-wrap;font-size:13px}</style><header><b>DHA Comparison Lab</b> — DehazeFormer</header><main><p>Завантаж фото. Обробка виконується на ПК, а результати відкриваються на планшеті.</p><input type="file" id="file" accept="image/*"><button id="run">Обробити T / S / B / M</button><div id="status">Очікування фотографії</div><div class="grid" id="grid"></div></main><script>const names=['original','dehazeformer-t','dehazeformer-s','dehazeformer-b','dehazeformer-m'];const labels=['ORIGINAL','DehazeFormer-T','DehazeFormer-S','DehazeFormer-B','DehazeFormer-M'];const grid=document.getElementById('grid');for(let i=0;i<names.length;i++){const d=document.createElement('div');d.className='tile';d.innerHTML='<h3>'+labels[i]+'</h3><img id="img'+i+'" alt="'+labels[i]+'">';grid.append(d)}const f=document.getElementById('file'),b=document.getElementById('run'),s=document.getElementById('status');f.onchange=()=>{if(f.files[0])document.getElementById('img0').src=URL.createObjectURL(f.files[0])};b.onclick=async()=>{if(!f.files[0]){s.textContent='Спочатку вибери фото';return}b.disabled=true;s.textContent='Обробка на ПК. Може тривати кілька хвилин…';try{const r=await fetch('/process',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f.files[0]});const d=await r.json();for(let i=0;i<names.length;i++){if(d.images?.[names[i]])document.getElementById('img'+i).src=d.images[names[i]]}s.textContent=d.ok?'Обробка завершена':('Помилка або частковий результат: '+(d.error||d.log||''))}catch(e){s.textContent='Помилка з’єднання: '+e.message}finally{b.disabled=false}}</script></html>
