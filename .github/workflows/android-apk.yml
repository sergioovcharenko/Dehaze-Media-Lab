name: Build Dehaze Tablet APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare offline WebGL assets
        run: python3 android/package_assets.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Dehaze-Media-Lab-Tablet-1.1-UNIVERSAL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dehaze-Media-Lab-Tablet-APK
          path: Dehaze-Media-Lab-Tablet-1.1-UNIVERSAL.apk
          retention-days: 30
