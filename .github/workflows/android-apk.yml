name: Build Dehaze Tablet APK

concurrency:
  group: dehaze-tablet-build
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Check JS syntax and AUTO 3.0 estimator
        run: |
          node --check --input-type=module < src/app.js
          node --check --input-type=module < src/gl.js
          node --check --input-type=module < src/auto3.js
          node --test tests/*.test.mjs
      - name: Validate WebGL shader source with glslang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          (echo '#version 100'; cat src/shaders/dehaze-webgl.frag) > /tmp/dehaze_auto3.frag
          glslangValidator -S frag /tmp/dehaze_auto3.frag
      - name: Prepare offline WebGL assets
        run: python3 android/package_assets.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Dehaze-Media-Lab-Tablet-1.5-AUTO3-NEW-ENGINE.apk
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view tablet-v1.5.0 >/dev/null 2>&1; then
            gh release upload tablet-v1.5.0 Dehaze-Media-Lab-Tablet-1.5-AUTO3-NEW-ENGINE.apk --clobber
          else
            gh release create tablet-v1.5.0 Dehaze-Media-Lab-Tablet-1.5-AUTO3-NEW-ENGINE.apk \
              --title "Dehaze Media Lab · Universal Android Tablet 1.5" \
              --notes "New independent AUTO 3.0 M17 multi-stage dehazing. AUTO 1.0/M14, AUTO 2.0/M16 and manual modes preserved. Includes tablet fullscreen and video/menu fixes. Android 8+, debug-signed, device testing required."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Dehaze-Media-Lab-Tablet-APK
          path: Dehaze-Media-Lab-Tablet-1.5-AUTO3-NEW-ENGINE.apk
          retention-days: 30
