plugins { id 'com.android.application' }
android {
    namespace 'ua.dehaze.medialab'
    compileSdk 35
    defaultConfig {
        applicationId 'ua.dehaze.medialab'
        minSdk 26
        targetSdk 34
        versionCode 106
        versionName '1.6-auto3-smooth-playback'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
